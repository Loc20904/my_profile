<main class="min-h-screen relative overflow-hidden bg-[#FBFBFA] dark:bg-[#09090B] text-zinc-900 dark:text-zinc-100 selection:bg-violet-500/20 selection:text-violet-400 transition-colors duration-300">
  
  <!-- Subtle Ambient Background Glow Orbs -->
  <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-violet-600/10 dark:bg-violet-600/15 blur-[120px] rounded-full pointer-events-none -z-10"></div>
  <div class="absolute top-[1200px] -right-40 w-[500px] h-[350px] bg-blue-600/5 dark:bg-blue-600/10 blur-[140px] rounded-full pointer-events-none -z-10"></div>

  <!-- Navbar -->
  <app-navbar />

  <!-- Hero Section -->
  <app-hero [profile]="profileData" />

  <!-- Key Metrics Bento Ribbon -->
  <app-metrics-ribbon [metrics]="profileData.metrics" />


  <!-- Case Studies -->
  <app-case-studies [projects]="profileData.projects" />

  <!-- Tech Radar -->
  <app-tech-radar [skills]="profileData.skills" />

  <!-- Timeline & Certifications -->
  <app-timeline 
    [timeline]="profileData.timeline" 
    [certifications]="profileData.certifications" />

  <!-- Footer -->
  <app-footer [profile]="profileData" />

</main>
